# Release pipeline: build .node ทุก platform → publish platform packages → publish main package
# npm จะโหลดเฉพาะ .node ของ OS ที่ตรงกับเครื่องผู้ใช้ผ่าน optionalDependencies
name: Release x-db

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            npm_platform: linux-x64-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            npm_platform: win32-x64-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
            npm_platform: darwin-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            npm_platform: darwin-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: cd typescript && npm install

      - name: Build native addon
        working-directory: typescript
        run: npx napi build --platform --release --target ${{ matrix.target }} --cargo-cwd ../crates/xdb-node --js xdb.cjs --dts xdb.d.ts .

      - name: Build TypeScript
        working-directory: typescript
        run: npm run build

      # ── สร้าง platform package (เช่น @elitjs/xdb-win32-x64-msvc) ──
      - name: Get version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Prepare platform package
        shell: bash
        run: |
          NODE_FILE=$(ls typescript/*.node | head -1)
          echo "Found: $NODE_FILE"

          mkdir -p platform-pkg
          cp "$NODE_FILE" platform-pkg/

          OS_NAME="linux"
          if [[ "${{ matrix.npm_platform }}" == win32* ]]; then OS_NAME="win32"; fi
          if [[ "${{ matrix.npm_platform }}" == darwin* ]]; then OS_NAME="darwin"; fi

          CPU_NAME="x64"
          if [[ "${{ matrix.npm_platform }}" == *arm64 ]]; then CPU_NAME="arm64"; fi

          NODE_BASENAME=$(basename "$NODE_FILE" .node)
          cat > platform-pkg/package.json << EOF
          {
            "name": "@elitjs/xdb-${{ matrix.npm_platform }}",
            "version": "${VERSION}",
            "main": "$NODE_BASENAME.node",
            "os": ["$OS_NAME"],
            "cpu": ["$CPU_NAME"],
            "description": "x-db native addon for ${{ matrix.npm_platform }}",
            "license": "MIT"
          }
          EOF

      - name: Publish platform package
        working-directory: platform-pkg
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload artifact (for main package)
        uses: actions/upload-artifact@v4
        with:
          name: xdb-${{ matrix.target }}
          path: |
            typescript/*.node
            typescript/xdb.cjs
            typescript/xdb.d.ts
            typescript/dist/

  publish-main:
    name: Publish main package
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Assemble main package
        run: |
          mkdir -p typescript/dist
          FIRST=$(ls artifacts/ | head -1)
          cp artifacts/$FIRST/xdb.cjs typescript/
          cp artifacts/$FIRST/xdb.d.ts typescript/
          cp -r artifacts/$FIRST/dist/* typescript/dist/
          cp README.md typescript/
          ls -la typescript/

      - name: Publish main package
        working-directory: typescript
        run: |
          npm pkg set optionalDependencies["@elitjs/xdb-win32-x64-msvc"]="${VERSION}"
          npm pkg set optionalDependencies["@elitjs/xdb-linux-x64-gnu"]="${VERSION}"
          npm pkg set optionalDependencies["@elitjs/xdb-darwin-x64"]="${VERSION}"
          npm pkg set optionalDependencies["@elitjs/xdb-darwin-arm64"]="${VERSION}"
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
