# Release pipeline: build .node ทุก platform แล้ว publish ขึ้น npm
# ใช้เมื่อ: push git tag (เช่น `git push origin v0.3.0`)
# ต้องตั้ง secret NPM_TOKEN ใน repo settings ก่อน
name: Release x-db

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: cd typescript && npm install

      - name: Build native addon
        working-directory: typescript
        run: npx napi build --platform --release --target ${{ matrix.target }} --cargo-cwd ../crates/xdb-node --js xdb2.cjs --dts xdb2.d.ts .

      - name: Build TypeScript
        working-directory: typescript
        run: npm run build


      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xdb2-${{ matrix.target }}
          path: |
            typescript/*.node
            typescript/xdb2.cjs
            typescript/xdb2.d.ts
            typescript/dist/

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble package
        run: |
          mkdir -p typescript/dist typescript/prebuilds
          FIRST=$(ls artifacts/ | head -1)
          cp artifacts/$FIRST/xdb2.cjs typescript/
          cp artifacts/$FIRST/xdb2.d.ts typescript/
          cp -r artifacts/$FIRST/dist/* typescript/dist/
          for d in artifacts/*/; do cp $d*.node typescript/prebuilds/ 2>/dev/null || true; done
          ls -la typescript/ typescript/prebuilds/

      - name: Publish
        working-directory: typescript
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            typescript/prebuilds/*.node
