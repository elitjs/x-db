[package]
name = "x-db"
version = "0.3.5"
edition = "2021"
description = "Read-optimized embedded key-value store (SSTable-style): bloom filter + mmap + CRC, with a realtime layered store (LSM-lite)"
license = "MIT"
repository = "https://github.com/elitjs/x-db"
keywords = ["database", "key-value", "embedded", "mmap", "sst"]
categories = ["database", "data-structures"]

[workspace]
members = ["crates/xdb-node", "crates/xdb-bench", "crates/xdb-cli"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }


[dependencies]
memmap2 = "0.9"
crc32fast = "1"
lz4_flex = "0.11"
fs4 = "0.13"
