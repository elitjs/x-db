[package]
name = "x-db"
version = "0.2.0"
edition = "2021"
description = "Read-optimized embedded key-value store (SSTable-style): bloom filter + mmap + CRC, with a realtime layered store (LSM-lite)"
license = "MIT"
repository = "https://github.com/d-osc/x-db"
keywords = ["database", "key-value", "embedded", "mmap", "sst"]
categories = ["database", "data-structures"]

[workspace]
members = ["crates/xdb-node", "crates/xdb-bench", "crates/xdb-cli"]


[dependencies]
memmap2 = "0.9"
crc32fast = "1"
lz4_flex = "0.11"
fs4 = "0.13"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[[bin]]
name = "xdb-server"
path = "src/main.rs"
