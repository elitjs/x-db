[package]
name = "x-db"
version = "0.1.0"
edition = "2021"

[workspace]
members = ["crates/xdb-node", "crates/xdb-bench"]


[dependencies]
memmap2 = "0.9"
crc32fast = "1"
fs4 = "0.13"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[[bin]]
name = "xdb-server"
path = "src/main.rs"
